# XcodeGen 설정 — 맥 없이 .xcodeproj 를 만드는 유일한 길이다.
# `.xcodeproj` 는 커밋하지 않는다 (.gitignore). CI 가 `xcodegen generate` 로 만든다.
#
# **앱 이름은 아래 두 줄에만 있다** (docs/roadmap.md §4):
#   · CFBundleDisplayName          — 홈 화면 · 스토어
#   · NSUbiquitousContainerName    — Files 앱의 폴더 이름
# 타깃 이름(Notebook)과 번들 ID 는 이름과 무관하게 고정한다.
#
# Info.plist 를 파일로 두지 않고 여기서 만든다 — `sources: App` 이 그 파일을
# 리소스로도 잡아 "Multiple commands produce" 로 빌드가 깨지는 것을 피한다.

name: Notebook

options:
  bundleIdPrefix: com.helpnara
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Core:
    path: Packages/Core

settings:
  base:
    MARKETING_VERSION: "1.0"
    # CI 가 실행 번호를 넣는다 — 빌드 번호와 실행 번호가 늘 같게.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: ko

targets:
  Notebook:
    type: application
    platform: iOS
    sources:
      # PrivacyInfo.xcprivacy 도 이 glob 이 잡는다. XcodeGen 은 모르는 확장자를
      # 리소스 단계에 넣으므로 번들에 그대로 들어간다.
      # .entitlements 는 어느 빌드 단계에도 안 들어간다 — 서명이 경로로만 읽는다.
      - App
    dependencies:
      - package: Core
        product: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpnara.markdown
        CODE_SIGN_ENTITLEMENTS: App/Notebook.entitlements
        # iPhone(1) · iPad(2) 유니버설 — 앱 하나, 화면 구성 두 벌 (ADR-0006)
        TARGETED_DEVICE_FAMILY: "1,2"
        # 아이콘이 없으면 App Store 검증이 CFBundleIconName 누락으로 막는다.
        # 에셋 카탈로그 컴파일러가 그 값을 Info.plist 에 넣어 준다.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]

        # **빌드 설정을 참조하게 한다.** 안 적으면 XcodeGen 이 Info.plist 에
        # 1 과 1.0 을 글자 그대로 박아 넣어, 워크플로가 넘긴 실행 번호가 앱에
        # 닿지 않는다. 지난 앱은 이것 때문에 36번째 실행이 폰에 빌드 24 로
        # 보였다. testflight.yml 의 "빌드 번호 = 실행 번호" 검사가 잡았다.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)

        # 스토어 · 홈 화면에 보이는 이름 (A1 확정 2026-09-13).
        CFBundleDisplayName: 느린 여백

        UILaunchScreen: {}

        # **수출 규정 질문을 미리 답해 둔다.**
        # 이 키가 없으면 App Store Connect 가 빌드를 올릴 때마다
        # "앱이 구현하는 암호화 알고리즘의 유형이 무엇입니까?" 를 묻고,
        # 답하기 전에는 빌드가 테스트 준비 완료로 안 넘어간다.
        #
        # false 인 근거: 이 앱은 **네트워크를 아예 쓰지 않는다** (설계서 §1).
        # 서버도 계정도 없고 iCloud Drive 동기화는 앱이 아니라 iOS 가 한다.
        # 앱 코드에 암호화 호출이 없다 — 화면의 선택지로는 "둘 다 아님" 이다.
        ITSAppUsesNonExemptEncryption: false

        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 아이패드는 네 방향 전부. 다 지원해야 멀티태스킹 · Stage Manager 에 들어간다.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

        # 권한 문구는 첫날 넣는다. 없으면 실기기에서 조용히 거부된다.
        NSPhotoLibraryUsageDescription: 노트에 넣을 사진을 고르려고 사진첩을 씁니다. 고르신 사진만 읽습니다.
        NSCameraUsageDescription: 노트에 넣을 사진을 바로 찍으려고 카메라를 씁니다.

        # 사용자 폴더를 Files 앱에서 열 수 있게 한다 (ADR-0002).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

        # `파일` 앱에서 .md 를 눌러 이 앱으로 열 수 있게 한다.
        #
        # **iOS 에는 "이 확장자의 기본 앱" 설정이 없다.** 설정 → 앱 → 기본 앱 은
        # 브라우저 · 메일 · 메시지 같은 것만 다루고 문서 종류는 없다. 앱이 스스로를
        # 기본으로 만드는 API 도 없다. 할 수 있는 것은 **다룰 수 있다고 선언**하는
        # 것뿐이고, 그러면 `파일` 앱의 공유 · 다음으로 열기 목록에 이 앱이 뜬다.
        #
        # `net.daringfireball.markdown` 은 애플이 정해 둔 것이 아니라 마크다운을
        # 다루는 앱들이 함께 쓰는 이름이다. 그래서 **Imported**(남이 정한 것을
        # 가져다 쓴다)이지 Exported(내가 정한다)가 아니다 — Exported 로 적으면
        # 옵시디언 · 율리시스와 같은 이름을 두고 다투게 된다.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: 마크다운 문서
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: [text/markdown, text/x-markdown]

        CFBundleDocumentTypes:
          - CFBundleTypeName: 마크다운 문서
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [net.daringfireball.markdown]
          # `.txt` 도 편집한다 (설계서 §14-2). 다만 메모 · 텍스트 편집기들이 이미
          # 있으므로 Alternate 다 — 남의 자리를 뺏지 않는다.
          - CFBundleTypeName: 텍스트 문서
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]

        # (a) 앱 iCloud Drive 컨테이너를 Files 앱에 보이게 한다.
        # CloudKit 레코드 타입을 쓰지 않으므로 스키마 배포가 없다 (ADR-0001 · 0002).
        NSUbiquitousContainers:
          iCloud.com.helpnara.markdown:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: Any
            # Files 앱에 보이는 폴더 이름.
            NSUbiquitousContainerName: 느린 여백
